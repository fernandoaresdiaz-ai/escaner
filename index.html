<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --ink: #17181a; --muted: #6d7075; --line: #e4e4df;
    --accent: #1f6feb; --accent-ink: #ffffff; --ok: #22c55e; --danger: #e5484d;
    --radius: 16px;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { display: block; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- barras ---------- */
  .topbar { padding: calc(var(--st) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; background: var(--bg); }
  .topbar h1 { font-size: 30px; letter-spacing: -0.02em; margin: 6px 0 0; flex: 1; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
  .iconbtn:active { background: rgba(0,0,0,.06); }
  .textbtn { color: var(--accent); font-weight: 600; font-size: 17px; padding: 8px 4px; display: flex; align-items: center; gap: 2px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(var(--sb) + 110px); }

  /* ---------- inicio ---------- */
  .doclist { display: flex; flex-direction: column; gap: 10px; }
  .docitem { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: var(--radius); padding: 10px; border: 1px solid var(--line); text-align: left; width: 100%; }
  .docitem:active { transform: scale(.985); }
  .docthumb { width: 56px; height: 72px; border-radius: 8px; background: #eee center/cover no-repeat; flex: none; border: 1px solid var(--line); }
  .docmeta { flex: 1; min-width: 0; }
  .docname { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .docsub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 24px; line-height: 1.5; }
  .empty svg { margin: 0 auto 16px; opacity: .5; }
  .tips { margin-top: 18px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 14px; color: var(--ink); }
  .tips b { display: block; margin-bottom: 6px; }
  .installhint { background: #e9f1ff; color: #12366b; border-radius: var(--radius); padding: 12px 14px; font-size: 14px; line-height: 1.4; margin-bottom: 14px; display: none; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sb) + 22px); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; padding: 16px 30px; border-radius: 999px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(31,111,235,.35); }
  .fab:active { transform: translateX(-50%) scale(.96); }

  /* ---------- cámara ---------- */
  #camera { background: #000; color: #fff; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .camtop { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--st) + 10px) 14px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .campill { background: rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
  .camround { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; }
  .camround.on { background: #ffd60a; color: #000; }
  .cambottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 22px calc(var(--sb) + 22px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 2; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .shutter { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; display: grid; place-items: center; }
  .shutter::after { content: ""; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .1s; }
  .shutter:active::after { transform: scale(.88); }
  .shutter:disabled { opacity: .4; }
  .stack { justify-self: start; width: 54px; height: 68px; border-radius: 8px; background: #333 center/cover no-repeat; border: 2px solid #fff; position: relative; visibility: hidden; }
  .stack.show { visibility: visible; }
  .badge { position: absolute; top: -8px; right: -8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; padding: 0 6px; }
  .donebtn { justify-self: end; background: #fff; color: #000; font-weight: 700; padding: 12px 18px; border-radius: 999px; visibility: hidden; }
  .donebtn.show { visibility: visible; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 3; }
  .flash.go { opacity: .7; transition: none; }
  .camerror { position: absolute; inset: 0; display: none; place-items: center; padding: 30px; text-align: center; line-height: 1.5; z-index: 4; background: #000; }

  /* ---------- documento ---------- */
  .nameinput { flex: 1; font: inherit; font-size: 17px; font-weight: 600; border: 0; background: transparent; padding: 8px 4px; min-width: 0; color: var(--ink); text-align: center; -webkit-user-select: text; user-select: text; }
  .nameinput:focus { outline: none; background: #fff; border-radius: 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .pagecard { background: var(--card); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .pageimg { aspect-ratio: 3/4; background: #f0f0ec center/contain no-repeat; position: relative; width: 100%; }
  .pagenum { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px 8px; }
  .pagewarn { position: absolute; right: 8px; top: 8px; background: #ffb020; color: #000; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 3px 7px; }
  .spinner { position: absolute; inset: 0; display: grid; place-items: center; }
  .spinner::after { content: ""; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #ccc; border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pagetools { display: flex; justify-content: space-between; border-top: 1px solid var(--line); }
  .pagetools button { flex: 1; height: 40px; display: grid; place-items: center; color: var(--muted); }
  .pagetools button:disabled { opacity: .25; }
  .pagetools button + button { border-left: 1px solid var(--line); }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--sb) + 14px); display: flex; gap: 10px; background: rgba(246,246,243,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .btn { flex: 1; height: 52px; border-radius: 14px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: #e9e9e4; color: var(--ink); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .45; }

  /* ---------- editor ---------- */
  #editor { background: #1b1c1e; color: #fff; }
  #editor .topbar { background: transparent; }
  #editor .textbtn { color: #8ab4ff; }
  .preview { flex: 1; position: relative; min-height: 0; margin: 0 12px; }
  .preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .preview .spinner::after { border-color: #444; border-top-color: #8ab4ff; }
  .chips { display: flex; gap: 8px; padding: 14px 12px 4px; overflow-x: auto; }
  .chip { flex: none; padding: 9px 14px; border-radius: 999px; background: #2c2e31; font-size: 14px; font-weight: 600; }
  .chip.on { background: #fff; color: #000; }
  .edtools { display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px calc(var(--sb) + 10px); }
  .edtool { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #c9ccd1; padding: 8px 0; border-radius: 12px; }
  .edtool:active { background: #2c2e31; }
  .edtool.red { color: #ff8a8d; }

  /* ---------- esquinas ---------- */
  #corners { background: #000; color: #fff; }
  .cstage { flex: 1; position: relative; min-height: 0; margin: 6px 14px; touch-action: none; }
  .cstage img { position: absolute; pointer-events: none; }
  .cstage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .handle { fill: rgba(31,111,235,.25); stroke: #fff; stroke-width: 3; }
  .loupe { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,.6); pointer-events: none; display: none; overflow: hidden; background: #000; }
  .cbar { display: flex; gap: 10px; padding: 10px 16px calc(var(--sb) + 14px); }
  .cbar .btn.secondary { background: #2c2e31; color: #fff; }

  /* ---------- hojas y diálogos ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 20; align-items: flex-end; }
  .scrim.show { display: flex; }
  .sheet { background: var(--card); width: 100%; border-radius: 22px 22px 0 0; padding: 20px 18px calc(var(--sb) + 18px); color: var(--ink); }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet p { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.4; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #efefea; border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { padding: 10px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; line-height: 1.2; }
  .seg button small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pdfinfo { text-align: center; font-size: 15px; color: var(--muted); min-height: 22px; margin-bottom: 14px; }
  .pdfinfo b { color: var(--ink); }
  .sheet .row { display: flex; gap: 10px; }
  .dialog { align-items: center; justify-content: center; padding: 24px; }
  .dialog .sheet { border-radius: 20px; max-width: 360px; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 100px); transform: translateX(-50%); background: rgba(20,20,22,.92); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; }
  .loading { position: fixed; inset: 0; background: rgba(0,0,0,.75); color: #fff; z-index: 30; display: none; place-items: center; text-align: center; padding: 30px; line-height: 1.5; }
  .loading.show { display: grid; }
  #loadingText { white-space: pre-line; max-width: 300px; }
  .loading .spinner { position: static; margin: 0 auto 14px; }
</style>
</head>
<body>

<!-- ============ INICIO ============ -->
<section class="screen active" id="home">
  <div class="topbar"><h1>Escáner</h1></div>
  <div class="scroll">
    <div class="installhint" id="installHint">
      <b>Instálala como app:</b> toca el botón <b>Compartir</b> de Safari y elige <b>«Añadir a pantalla de inicio»</b>.
    </div>
    <div class="doclist" id="docList"></div>
  </div>
  <button class="fab" id="scanBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
    Escanear
  </button>
</section>

<!-- ============ CÁMARA ============ -->
<section class="screen" id="camera">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="flash" id="flash"></div>
  <div class="camtop">
    <button class="camround" id="camClose" aria-label="Cerrar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="campill" id="camHint">Buscando la hoja…</div>
    <button class="camround" id="torchBtn" aria-label="Linterna" style="visibility:hidden">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 2h8v4l-2 3v13h-4V9L8 6z"/><path d="M12 13v3"/></svg>
    </button>
  </div>
  <div class="cambottom">
    <button class="stack" id="camStack" aria-label="Ver páginas"><span class="badge" id="camCount">0</span></button>
    <button class="shutter" id="shutter" aria-label="Hacer foto"></button>
    <button class="donebtn" id="camDone">Hecho</button>
  </div>
  <div class="camerror" id="camError"></div>
</section>

<!-- ============ DOCUMENTO ============ -->
<section class="screen" id="doc">
  <div class="topbar">
    <button class="textbtn" id="docBack">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>
      Inicio
    </button>
    <input class="nameinput" id="docName" maxlength="80" enterkeyhint="done">
    <button class="iconbtn" id="docDelete" aria-label="Borrar documento" style="color:var(--danger)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
  </div>
  <div class="scroll"><div class="grid" id="pageGrid"></div></div>
  <div class="bottombar">
    <button class="btn secondary" id="addPages">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Añadir páginas
    </button>
    <button class="btn primary" id="exportBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      PDF
    </button>
  </div>
</section>

<!-- ============ EDITOR DE PÁGINA ============ -->
<section class="screen" id="editor">
  <div class="topbar">
    <div style="flex:1;font-weight:600" id="edTitle">Página</div>
    <button class="textbtn" id="edDone">Listo</button>
  </div>
  <div class="preview" id="edPreview"><img id="edImg" alt=""></div>
  <div class="chips" id="edChips">
    <button class="chip" data-f="sombras">Sin sombras</button>
    <button class="chip" data-f="original">Color original</button>
    <button class="chip" data-f="gris">Escala de grises</button>
    <button class="chip" data-f="bn">Blanco y negro</button>
  </div>
  <div class="edtools">
    <button class="edtool" id="edCorners">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>Esquinas</button>
    <button class="edtool" id="edRotL">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v5h5"/><path d="M3.5 9A9 9 0 1 1 6 18"/></svg>Girar ←</button>
    <button class="edtool" id="edRotR">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v5h-5"/><path d="M20.5 9A9 9 0 1 0 18 18"/></svg>Girar →</button>
    <button class="edtool" id="edAll">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>Filtro a todas</button>
    <button class="edtool red" id="edDelete">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar</button>
  </div>
</section>

<!-- ============ AJUSTAR ESQUINAS ============ -->
<section class="screen" id="corners">
  <div class="topbar" style="background:transparent">
    <div style="flex:1;font-weight:600">Ajustar esquinas</div>
    <button class="textbtn" id="cAuto" style="color:#8ab4ff">Auto</button>
    <button class="textbtn" id="cFull" style="color:#8ab4ff;margin-left:8px">Hoja entera</button>
  </div>
  <div class="cstage" id="cStage">
    <img id="cImg" alt="">
    <svg id="cSvg"></svg>
    <canvas class="loupe" id="cLoupe" width="240" height="240"></canvas>
  </div>
  <div class="cbar">
    <button class="btn secondary" id="cCancel">Cancelar</button>
    <button class="btn primary" id="cApply">Aplicar</button>
  </div>
</section>

<!-- ============ EXPORTAR ============ -->
<div class="scrim" id="exportSheet">
  <div class="sheet">
    <h2>Exportar PDF</h2>
    <p>Elige el tamaño. «Correo» pesa menos y se sigue leyendo bien.</p>
    <div class="seg" id="qualitySeg">
      <button data-q="alta">Alta<small>máxima calidad</small></button>
      <button data-q="media">Correo<small>equilibrado</small></button>
      <button data-q="baja">Mínima<small>pesa muy poco</small></button>
    </div>
    <div class="pdfinfo" id="pdfInfo"></div>
    <div class="row">
      <button class="btn secondary" id="exportCancel">Cerrar</button>
      <button class="btn primary" id="exportShare" disabled>Compartir o guardar</button>
    </div>
  </div>
</div>

<!-- ============ CONFIRMAR ============ -->
<div class="scrim dialog" id="confirmDlg">
  <div class="sheet">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="row">
      <button class="btn secondary" id="confirmNo">Cancelar</button>
      <button class="btn danger" id="confirmYes">Borrar</button>
    </div>
  </div>
</div>

<div class="loading" id="loading"><div><div class="spinner"></div><div id="loadingText">Cargando…</div></div></div>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
